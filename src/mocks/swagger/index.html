<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ALS API – Swagger (mock)</title>
    <link rel="icon" type="image/png" href="/docs/favicon-32x32.png" />
    <link rel="stylesheet" href="/docs/swagger-ui.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; }
      .mockbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
        padding: 10px 20px; background: #1b1b1b; color: #fff; font-size: 14px;
      }
      .mockbar strong { font-size: 15px; margin-right: 8px; }
      .mockbar label { display: flex; gap: 6px; align-items: center; }
      .mockbar select, .mockbar button {
        font: inherit; padding: 4px 8px; border-radius: 4px; border: 1px solid #555;
        background: #2b2b2b; color: #fff; cursor: pointer;
      }
      .mockbar button:hover { background: #3a3a3a; }
      .mockbar .hint { color: #bbb; font-size: 13px; }
      .mockbar .status { color: #8fd18f; font-size: 13px; min-width: 120px; }
    </style>
  </head>
  <body>
    <div class="mockbar">
      <strong>Mock ALS</strong>
      <label>Rôle (token)
        <select id="role"></select>
      </label>
      <label>Scénario
        <select id="scenario"></select>
      </label>
      <button id="reset" type="button">Réinitialiser les données</button>
      <span class="status" id="status"></span>
      <span class="hint">X-Correlation-Id et Idempotency-Key sont générés automatiquement s'ils sont vides.</span>
    </div>
    <div id="swagger-ui"></div>

    <script src="/docs/swagger-ui-bundle.js"></script>
    <script>
      const TOKENS = __TOKENS__;
      const roleSelect = document.getElementById("role");
      const scenarioSelect = document.getElementById("scenario");
      const statusEl = document.getElementById("status");

      const flash = (text) => {
        statusEl.textContent = text;
        setTimeout(() => { if (statusEl.textContent === text) statusEl.textContent = ""; }, 2500);
      };
      const remember = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
      const recall = (key) => { try { return localStorage.getItem(key); } catch { return null; } };

      for (const role of Object.keys(TOKENS)) roleSelect.add(new Option(role, role));
      roleSelect.value = recall("mockRole") in TOKENS ? recall("mockRole") : "ADMIN";

      const ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        docExpansion: "list",
        filter: true,
        tryItOutEnabled: true,
        displayRequestDuration: true,
        showExtensions: false,
        requestInterceptor: (request) => {
          if (request.url.includes("/api/v1/")) {
            const headers = request.headers;
            if (!headers["X-Correlation-Id"]) headers["X-Correlation-Id"] = crypto.randomUUID();
            if (/\/(deposits|withdrawals)$/.test(new URL(request.url, location.href).pathname) && !headers["Idempotency-Key"]) {
              headers["Idempotency-Key"] = crypto.randomUUID();
            }
          }
          return request;
        },
        onComplete: () => applyRole(roleSelect.value),
      });

      function applyRole(role) {
        ui.preauthorizeApiKey("bearerAuth", TOKENS[role]);
        remember("mockRole", role);
      }
      roleSelect.addEventListener("change", () => { applyRole(roleSelect.value); flash("Token : " + roleSelect.value); });

      async function loadScenario() {
        const info = await (await fetch("/__mock")).json();
        scenarioSelect.innerHTML = "";
        for (const s of info.scenarios) scenarioSelect.add(new Option(s, s));
        scenarioSelect.value = info.scenario;
      }
      scenarioSelect.addEventListener("change", async () => {
        await fetch("/__mock/scenario", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scenario: scenarioSelect.value }),
        });
        flash("Scénario : " + scenarioSelect.value);
      });
      document.getElementById("reset").addEventListener("click", async () => {
        await fetch("/__mock/reset", { method: "POST" });
        await loadScenario();
        flash("Données réinitialisées");
      });
      loadScenario();
    </script>
  </body>
</html>
