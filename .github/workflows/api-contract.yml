name: API contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint the OpenAPI contract
        run: npm run api:lint
      - name: Generated types are up to date with the contract
        run: npm run api:check-types
      - name: Typecheck
        run: npm run typecheck
      - name: Contract and mock tests
        run: npm test
