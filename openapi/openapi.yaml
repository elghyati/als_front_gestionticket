openapi: 3.1.0
info:
  title: ALS Front – MVP API contract
  version: 0.2.0
  description: |
    Contract between the MVP front-end (kiosk and portal) and the back-end
    services (Agent, KMS-Supervision, KMS-Routeur), which are not ready yet.
    The front-end builds against this contract and the MSW mock in `src/mocks`.

    **Status: DRAFT** – frozen on Mon 12 Oct. After the freeze, changes go
    through a documented change request with the affected owners.

    Conventions:
    - Every request carries an `X-Correlation-Id` header (UUID); every response
      and every error echoes it.
    - Every error uses the `Error` schema.
    - Amounts are decimal numbers in the account currency (ISO 4217 code).
    - Lists are returned as `{ items }`; long lists are paginated with an
      opaque `cursor` / `nextCursor`.
    - Create returns `201`, partial update is `PATCH`, delete returns `204`.
      A duplicate code or a delete blocked by a dependency returns `409`.

    KMS (Kiosk Management System) access by role:

    | Operations | Roles |
    |---|---|
    | Read kiosks, devices, history, catalogue, services | AGENT, SUPERVISOR, ADMIN |
    | Change a device status | SUPERVISOR, ADMIN |
    | Create / update / delete, assignments, requirements, settings | ADMIN |
    | Read the services of a kiosk, read deposit and withdrawal settings | any authenticated user (the kiosk app needs them) |

    Service availability on a kiosk (computed, see `KioskService`):
    a device is *usable* when its status is `OPERATIONAL` or `WARNING`.
    For each device type the service requires, if the kiosk has no usable
    device of that type:
    - `MANDATORY` → the service is `UNAVAILABLE`
    - `RECOMMENDED` → the service is `DEGRADED` (works, with reduced features)
    - `OPTIONAL` → the service stays `AVAILABLE`; the issue is still reported
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1
    description: Same origin (MSW mock in dev, reverse proxy later)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication (kiosk card/PIN and portal user login)
  - name: accounts
    description: Balance and history
  - name: transactions
    description: Deposit and withdrawal operations
  - name: kms-kiosks
    description: Kiosks (CRUD) and the services assigned to them
  - name: kms-devices
    description: Devices of a kiosk, their status and status history
  - name: kms-settings
    description: Configuration – device catalogue, services, service/device requirements, deposit and withdrawal settings

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in and get an access token
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ─────────────────────────── accounts ───────────────────────────
  /accounts/{accountId}/balance:
    get:
      tags: [accounts]
      operationId: getBalance
      summary: Get the balance of an account
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Current balance
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /accounts/{accountId}/transactions:
    get:
      tags: [accounts]
      operationId: listTransactions
      summary: Get the transaction history of an account (newest first)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of history
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ───────────────────────── transactions ─────────────────────────
  /deposits:
    post:
      tags: [transactions]
      operationId: createDeposit
      summary: Make a deposit on a kiosk
      description: |
        Refused with `422` when the DEPOSIT service is not available on the
        kiosk, or when a rule of `DepositSettings` is not met.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Deposit accepted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /withdrawals:
    post:
      tags: [transactions]
      operationId: createWithdrawal
      summary: Make a cash withdrawal on a kiosk
      description: |
        Refused with `422` when the WITHDRAWAL service is not available on the
        kiosk, when a rule of `WithdrawalSettings` is not met, or when the
        available balance is insufficient. The accepted envelope carries the
        notes to dispense in `cashBreakdown`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '201':
          description: Withdrawal accepted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ────────────────────────── KMS: kiosks ─────────────────────────
  /kms/kiosks:
    get:
      tags: [kms-kiosks]
      operationId: listKiosks
      summary: List the kiosks
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/KioskStatus'
        - name: health
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/KioskHealth'
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive search in id and name
          schema:
            type: string
      responses:
        '200':
          description: Kiosks
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kiosk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [kms-kiosks]
      operationId: createKiosk
      summary: Create a kiosk
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskCreate'
      responses:
        '201':
          description: Kiosk created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kiosk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/kiosks/{kioskId}:
    get:
      tags: [kms-kiosks]
      operationId: getKiosk
      summary: Get a kiosk
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
      responses:
        '200':
          description: Kiosk
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kiosk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [kms-kiosks]
      operationId: updateKiosk
      summary: Update a kiosk (partial)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskUpdate'
      responses:
        '200':
          description: Kiosk updated
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kiosk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [kms-kiosks]
      operationId: deleteKiosk
      summary: Delete a kiosk
      description: |
        Refused with `409` while the kiosk is `ONLINE` (put it in
        `MAINTENANCE` first). Deletes its devices and service assignments;
        the device status history is kept for audit.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
      responses:
        '204':
          description: Kiosk deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/kiosks/{kioskId}/services:
    get:
      tags: [kms-kiosks]
      operationId: listKioskServices
      summary: List the services assigned to a kiosk, with their computed availability
      description: Used by the kiosk app to build its menu and by the degraded mode.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
      responses:
        '200':
          description: Assigned services
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/KioskService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/kiosks/{kioskId}/services/{serviceCode}:
    put:
      tags: [kms-kiosks]
      operationId: assignKioskService
      summary: Assign a service to a kiosk, or update the assignment
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - $ref: '#/components/parameters/ServiceCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskServiceAssignment'
      responses:
        '200':
          description: Service assigned
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [kms-kiosks]
      operationId: unassignKioskService
      summary: Remove a service from a kiosk
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - $ref: '#/components/parameters/ServiceCode'
      responses:
        '204':
          description: Service removed from the kiosk
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ────────────────────────── KMS: devices ────────────────────────
  /kms/kiosks/{kioskId}/devices:
    get:
      tags: [kms-devices]
      operationId: listKioskDevices
      summary: List the devices of a kiosk
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeviceStatus'
      responses:
        '200':
          description: Devices
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/KioskDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [kms-devices]
      operationId: addKioskDevice
      summary: Install a device on a kiosk
      description: Records the initial status in the status history.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskDeviceCreate'
      responses:
        '201':
          description: Device installed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/kiosks/{kioskId}/devices/{deviceId}:
    get:
      tags: [kms-devices]
      operationId: getKioskDevice
      summary: Get a device of a kiosk
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [kms-devices]
      operationId: updateKioskDevice
      summary: Update a device (partial). The status changes through its own endpoint.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskDeviceUpdate'
      responses:
        '200':
          description: Device updated
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [kms-devices]
      operationId: removeKioskDevice
      summary: Remove a device from a kiosk
      description: The device status history is kept for audit.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Device removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/kiosks/{kioskId}/devices/{deviceId}/status:
    put:
      tags: [kms-devices]
      operationId: changeDeviceStatus
      summary: Change the status of a device
      description: |
        Records a `DeviceStatusChange` in the history when the status or the
        reason code changes. Sending the current status and reason again is a
        no-op (no history entry), so the call is safe to retry.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusChangeRequest'
      responses:
        '200':
          description: Device with its new status
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KioskDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/kiosks/{kioskId}/devices/{deviceId}/status-history:
    get:
      tags: [kms-devices]
      operationId: listDeviceStatusHistory
      summary: Status history of one device (newest first)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of history
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/kiosks/{kioskId}/status-history:
    get:
      tags: [kms-devices]
      operationId: listKioskStatusHistory
      summary: Status history of all the devices of a kiosk (newest first)
      description: Includes devices that were removed since.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/KioskId'
        - name: deviceTypeCode
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Only changes to this status
          schema:
            $ref: '#/components/schemas/DeviceStatus'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of history
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
