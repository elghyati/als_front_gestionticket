      operationId: deleteService
      summary: Delete a service
      description: Refused with `409` for a built-in service or while the service is assigned to a kiosk.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ServiceCode'
      responses:
        '204':
          description: Service deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/services/{serviceCode}/device-requirements:
    get:
      tags: [kms-settings]
      operationId: listServiceDeviceRequirements
      summary: Device types a service needs, with their requirement level
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ServiceCode'
      responses:
        '200':
          description: Requirements
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceDeviceRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/services/{serviceCode}/device-requirements/{deviceTypeCode}:
    put:
      tags: [kms-settings]
      operationId: setServiceDeviceRequirement
      summary: Link a device type to a service with a requirement level, or change the level
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ServiceCode'
        - $ref: '#/components/parameters/DeviceTypeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirement]
              additionalProperties: false
              properties:
                requirement:
                  $ref: '#/components/schemas/RequirementLevel'
      responses:
        '200':
          description: Requirement saved
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDeviceRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [kms-settings]
      operationId: removeServiceDeviceRequirement
      summary: Unlink a device type from a service
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ServiceCode'
        - $ref: '#/components/parameters/DeviceTypeCode'
      responses:
        '204':
          description: Requirement removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ──────────────── KMS settings: deposit and withdrawal ──────────
  /kms/deposit-settings:
    get:
      tags: [kms-settings]
      operationId: getDepositSettings
      summary: Get the deposit service settings
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Deposit settings
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    put:
      tags: [kms-settings]
      operationId: updateDepositSettings
      summary: Replace the deposit service settings
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositSettings'
      responses:
        '200':
          description: Deposit settings saved
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /kms/withdrawal-settings:
    get:
      tags: [kms-settings]
      operationId: getWithdrawalSettings
      summary: Get the withdrawal service settings
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Withdrawal settings
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    put:
      tags: [kms-settings]
      operationId: updateWithdrawalSettings
      summary: Replace the withdrawal service settings
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalSettings'
      responses:
        '200':
          description: Withdrawal settings saved
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: Generated by the front-end per user action, propagated end to end
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per operation attempt; a retry with the same key must not execute twice
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    KioskId:
      name: kioskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Code'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    ServiceCode:
      name: serviceCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Code'
    DeviceTypeCode:
      name: deviceTypeCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Code'
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `nextCursor` by the previous page
      schema:
        type: string
    From:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on the change date
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on the change date
      schema:
        type: string
        format: date-time

  headers:
    CorrelationId:
      description: Echo of the request correlation id
      schema:
        type: string
        format: uuid

  schemas:
    Code:
      description: Business identifier chosen at creation, upper case
      type: string
      pattern: '^[A-Z0-9][A-Z0-9_-]{1,31}$'
      examples: [KIOSK-01, CASH_ACCEPTOR, DEPOSIT]

    # ─────────────── auth ───────────────
    LoginRequest:
      oneOf:
        - $ref: '#/components/schemas/KioskLogin'
        - $ref: '#/components/schemas/PortalLogin'
      discriminator:
        propertyName: channel
        mapping:
          KIOSK: '#/components/schemas/KioskLogin'
          PORTAL: '#/components/schemas/PortalLogin'
    KioskLogin:
      type: object
      required: [channel, cardNumber, pin, kioskId]
      properties:
        channel:
          const: KIOSK
        cardNumber:
          type: string
        pin:
          type: string
          pattern: '^[0-9]{4,6}$'
        kioskId:
          $ref: '#/components/schemas/Code'
    PortalLogin:
      type: object
      required: [channel, username, password]
      properties:
        channel:
          const: PORTAL
        username:
          type: string
        password:
          type: string
          format: password
    Session:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, displayName, roles]
      properties:
        id:
          type: string
        displayName:
          type: string
        accountIds:
          description: Accounts the user may operate (kiosk customers)
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum: [CUSTOMER, AGENT, SUPERVISOR, ADMIN, COMPLIANCE]

    # ─────────────── money and transactions ───────────────
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [MAD]
    Balance:
      type: object
      required: [accountId, available, ledger, asOf]
      properties:
        accountId:
          type: string
        available:
          $ref: '#/components/schemas/Money'
        ledger:
          $ref: '#/components/schemas/Money'
        asOf:
          type: string
          format: date-time
    CashNotes:
      description: Banknotes counted (deposit) or dispensed (withdrawal)
      type: array
      items:
        type: object
        required: [denomination, count]
        properties:
          denomination:
            type: integer
            minimum: 1
          count:
            type: integer
            minimum: 1
    DepositRequest:
      type: object
      required: [accountId, kioskId, amount]
      properties:
        accountId:
          type: string
        kioskId:
          $ref: '#/components/schemas/Code'
        amount:
          $ref: '#/components/schemas/Money'
        notes:
          description: Notes counted by the cash acceptor; when given, they must add up to `amount`
          allOf:
            - $ref: '#/components/schemas/CashNotes'
    WithdrawalRequest:
      type: object
      required: [accountId, kioskId, amount]
      properties:
        accountId:
          type: string
        kioskId:
          $ref: '#/components/schemas/Code'
        amount:
          $ref: '#/components/schemas/Money'
    TransactionType:
      type: string
      enum: [DEPOSIT, WITHDRAWAL, TRANSFER, FEE]
    TransactionStatus:
      type: string
      enum: [ACCEPTED, PENDING, REFUSED, REVERSED]
    TransactionEnvelope:
      description: |
        Generic transaction envelope. TO ALIGN with the Epic 1 envelope and the
        Router contract before the freeze (open question OQ-1).
      type: object
      required: [transactionId, correlationId, type, status, amount, accountId, createdAt]
      properties:
        transactionId:
          type: string
        correlationId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        accountId:
          type: string
        kioskId:
          $ref: '#/components/schemas/Code'
        amount:
          $ref: '#/components/schemas/Money'
        cashBreakdown:
          description: Notes counted (deposit) or to dispense (withdrawal)
          allOf:
            - $ref: '#/components/schemas/CashNotes'
        createdAt:
          type: string
          format: date-time
        reasonCode:
          description: Set when status is REFUSED or REVERSED
          type: string
    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionEnvelope'
        nextCursor:
          description: Absent on the last page
          type: string

    # ─────────────── KMS: kiosks ───────────────
    KioskStatus:
      description: Operational status, set by an administrator or by the kiosk heartbeat
      type: string
      enum: [ONLINE, OFFLINE, MAINTENANCE]
    KioskHealth:
      description: |
        Computed. `OUT_OF_SERVICE` when the kiosk is not ONLINE or no assigned
        service is available; `DEGRADED` when a service is not fully available
        or a device is not usable; else `HEALTHY`.
      type: string
      enum: [HEALTHY, DEGRADED, OUT_OF_SERVICE]
    Location:
      type: object
      required: [branchName, city]
      properties:
        branchCode:
          type: string
        branchName:
          type: string
        address:
          type: string
        city:
          type: string
    Kiosk:
      type: object
      required: [kioskId, name, location, status, health, deviceCount, createdAt, updatedAt]
      properties:
        kioskId:
          $ref: '#/components/schemas/Code'
        name:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        ipAddress:
          type: string
          format: ipv4
        softwareVersion:
          type: string
        status:
          $ref: '#/components/schemas/KioskStatus'
        health:
          $ref: '#/components/schemas/KioskHealth'
        deviceCount:
          type: integer
          minimum: 0
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KioskCreate:
      type: object
      required: [kioskId, name, location]
      additionalProperties: false
      properties:
        kioskId:
          $ref: '#/components/schemas/Code'
        name:
          type: string
          minLength: 1
        location:
          $ref: '#/components/schemas/Location'
        ipAddress:
          type: string
          format: ipv4
        softwareVersion:
          type: string
        status:
          description: Defaults to MAINTENANCE until the kiosk is configured
          allOf:
            - $ref: '#/components/schemas/KioskStatus'
    KioskUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        location:
          $ref: '#/components/schemas/Location'
        ipAddress:
          type: string
          format: ipv4
        softwareVersion:
          type: string
        status:
          $ref: '#/components/schemas/KioskStatus'

    # ─────────────── KMS: kiosk services ───────────────
    KioskServiceAssignment:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          description: Switch the service on or off on this kiosk only
          type: boolean
    ServiceAvailabilityStatus:
      type: string
      enum: [AVAILABLE, DEGRADED, UNAVAILABLE]
    AvailabilityIssue:
      type: object
      required: [reasonCode, message]
      properties:
        reasonCode:
          type: string
          enum: [SERVICE_DISABLED, SERVICE_DISABLED_ON_KIOSK, KIOSK_NOT_ONLINE, DEVICE_MISSING, DEVICE_NOT_USABLE]
        message:
          type: string
        deviceTypeCode:
          $ref: '#/components/schemas/Code'
        requirement:
          $ref: '#/components/schemas/RequirementLevel'
    KioskService:
      type: object
      required: [serviceCode, name, enabled, availability, issues, assignedAt]
      properties:
        serviceCode:
          $ref: '#/components/schemas/Code'
        name:
          type: string
        enabled:
          description: Assignment switch on this kiosk
          type: boolean
        availability:
          $ref: '#/components/schemas/ServiceAvailabilityStatus'
        issues:
          description: Why the service is not fully available; empty when everything is fine
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityIssue'
        assignedAt:
          type: string
          format: date-time

    # ─────────────── KMS: devices ───────────────
    DeviceStatus:
      description: |
        `OPERATIONAL` and `WARNING` (e.g. paper low) are usable; `ERROR`,
        `OFFLINE` (not responding), `MAINTENANCE` and `DISABLED` are not.
      type: string
      enum: [OPERATIONAL, WARNING, ERROR, OFFLINE, MAINTENANCE, DISABLED]
    StatusChangeSource:
      type: string
      enum: [DEVICE, OPERATOR, SYSTEM]
    KioskDevice:
      type: object
      required: [deviceId, kioskId, deviceTypeCode, serialNumber, status, statusChangedAt, installedAt, updatedAt]
      properties:
        deviceId:
          type: string
        kioskId:
          $ref: '#/components/schemas/Code'
        deviceTypeCode:
          $ref: '#/components/schemas/Code'
        serialNumber:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        firmwareVersion:
          type: string
        status:
          $ref: '#/components/schemas/DeviceStatus'
        statusReasonCode:
          type: string
          examples: [PAPER_LOW, JAM, NOT_RESPONDING]
        statusReason:
          type: string
        statusChangedAt:
          type: string
          format: date-time
        installedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KioskDeviceCreate:
      type: object
      required: [deviceTypeCode, serialNumber]
      additionalProperties: false
      properties:
        deviceTypeCode:
          $ref: '#/components/schemas/Code'
        serialNumber:
          type: string
          minLength: 1
        manufacturer:
          type: string
        model:
          type: string
        firmwareVersion:
          type: string
        status:
          description: Initial status, defaults to OPERATIONAL
          allOf:
            - $ref: '#/components/schemas/DeviceStatus'
    KioskDeviceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        serialNumber:
          type: string
          minLength: 1
        manufacturer:
          type: string
        model:
          type: string
        firmwareVersion:
          type: string
    DeviceStatusChangeRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/DeviceStatus'
        reasonCode:
          type: string
          examples: [PAPER_LOW, JAM, NOT_RESPONDING]
        reason:
          type: string
        source:
          description: Defaults to OPERATOR
          allOf:
            - $ref: '#/components/schemas/StatusChangeSource'
    DeviceStatusChange:
      description: One entry of the device status history
      type: object
      required: [changeId, kioskId, deviceId, deviceTypeCode, newStatus, source, changedAt, correlationId]
      properties:
        changeId:
          type: string
        kioskId:
          $ref: '#/components/schemas/Code'
        deviceId:
          type: string
        deviceTypeCode:
          $ref: '#/components/schemas/Code'
        previousStatus:
          description: Absent for the initial status
          allOf:
            - $ref: '#/components/schemas/DeviceStatus'
        newStatus:
          $ref: '#/components/schemas/DeviceStatus'
        reasonCode:
          type: string
        reason:
          type: string
        source:
          $ref: '#/components/schemas/StatusChangeSource'
        changedBy:
          description: User id when the source is OPERATOR
          type: string
        changedAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
    DeviceStatusHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatusChange'
        nextCursor:
          description: Absent on the last page
          type: string

    # ─────────────── KMS settings: device catalogue ───────────────
    DeviceCategory:
      type: string
      enum: [CASH, CARD, PRINTER, INPUT, DISPLAY, SENSOR, OTHER]
    DeviceType:
      type: object
      required: [deviceTypeCode, name, category, createdAt, updatedAt]
      properties:
        deviceTypeCode:
          $ref: '#/components/schemas/Code'
        name:
          type: string
        category:
          $ref: '#/components/schemas/DeviceCategory'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeviceTypeCreate:
      type: object
      required: [deviceTypeCode, name, category]
      additionalProperties: false
      properties:
        deviceTypeCode:
          $ref: '#/components/schemas/Code'
        name:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/DeviceCategory'
        description:
          type: string
    DeviceTypeUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/DeviceCategory'
        description:
          type: string

    # ─────────────── KMS settings: services ───────────────
    RequirementLevel:
      description: |
        How much a service needs a device type:
        `MANDATORY` – service unavailable without it;
        `RECOMMENDED` – service degraded without it;
        `OPTIONAL` – service available without it (feature reduced, e.g. no receipt).
      type: string
      enum: [MANDATORY, RECOMMENDED, OPTIONAL]
    ServiceDeviceRequirement:
      type: object
      required: [deviceTypeCode, requirement]
      properties:
        deviceTypeCode:
          $ref: '#/components/schemas/Code'
        requirement:
          $ref: '#/components/schemas/RequirementLevel'
    Service:
      type: object
      required: [serviceCode, name, enabled, builtIn, deviceRequirements, createdAt, updatedAt]
      properties:
        serviceCode:
          $ref: '#/components/schemas/Code'
        name:
          type: string
        description:
          type: string
        enabled:
          description: Global switch; when false the service is unavailable on every kiosk
          type: boolean
        builtIn:
          description: Built-in services (DEPOSIT, WITHDRAWAL, BALANCE, HISTORY, ACCOUNT_OPENING) cannot be deleted
          type: boolean
        deviceRequirements:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDeviceRequirement'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceCreate:
      type: object
      required: [serviceCode, name]
      additionalProperties: false
      properties:
        serviceCode:
          $ref: '#/components/schemas/Code'
        name:
          type: string
          minLength: 1
        description:
          type: string
        enabled:
          description: Defaults to true
          type: boolean
    ServiceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        enabled:
          type: boolean

    # ─────────────── KMS settings: deposit and withdrawal ───────────────
    ReceiptMode:
      type: string
      enum: [ALWAYS, ON_REQUEST, NEVER]
    DepositSettings:
      description: Rules of the DEPOSIT service. `minAmount <= maxAmountPerTransaction <= dailyLimitPerAccount`.
      type: object
      required: [currency, minAmount, maxAmountPerTransaction, dailyLimitPerAccount, acceptedDenominations, maxNotesPerTransaction, receiptMode]
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        minAmount:
          type: number
          exclusiveMinimum: 0
        maxAmountPerTransaction:
          type: number
          exclusiveMinimum: 0
        dailyLimitPerAccount:
          type: number
          exclusiveMinimum: 0
        acceptedDenominations:
          description: Notes the cash acceptor takes
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        maxNotesPerTransaction:
          type: integer
          minimum: 1
        receiptMode:
          $ref: '#/components/schemas/ReceiptMode'
    WithdrawalSettings:
      description: Rules of the WITHDRAWAL service. `minAmount <= maxAmountPerTransaction <= dailyLimitPerAccount`.
      type: object
      required: [currency, minAmount, maxAmountPerTransaction, dailyLimitPerAccount, amountMultipleOf, dispensableDenominations, maxNotesPerTransaction, presetAmounts, receiptMode]
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        minAmount:
          type: number
          exclusiveMinimum: 0
        maxAmountPerTransaction:
          type: number
          exclusiveMinimum: 0
        dailyLimitPerAccount:
          type: number
          exclusiveMinimum: 0
        amountMultipleOf:
          description: Every amount must be a multiple of this value (smallest dispensable note)
          type: integer
          minimum: 1
        dispensableDenominations:
          description: Notes loaded in the cash dispenser
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        maxNotesPerTransaction:
          type: integer
          minimum: 1
        presetAmounts:
          description: Quick-pick amounts shown on the kiosk
          type: array
          uniqueItems: true
          items:
            type: number
            exclusiveMinimum: 0
        receiptMode:
          $ref: '#/components/schemas/ReceiptMode'

    # ─────────────── account opening (KYC) ───────────────
    ApplicationStatus:
      description: |
        `DRAFT` (being filled) → submit → `APPROVED` (account opened),
        `UNDER_REVIEW` (compliance decides) or `REJECTED`. `CANCELLED` from
        `DRAFT` or `UNDER_REVIEW`.
      type: string
      enum: [DRAFT, UNDER_REVIEW, APPROVED, REJECTED, CANCELLED]
    ApplicationChannel:
      description: '`KIOSK`: self-service with an application token. `BRANCH`: an agent in the portal.'
      type: string
      enum: [KIOSK, BRANCH]
    AccountProduct:
      type: string
      enum: [CURRENT_ACCOUNT, SAVINGS_ACCOUNT, BASIC_ACCOUNT]
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    IdDocumentType:
      type: string
      enum: [CIN, PASSPORT, RESIDENCE_PERMIT]
    IncomeRange:
      description: Monthly income in MAD
      type: string
      enum: [UNDER_3000, FROM_3000_TO_10000, FROM_10000_TO_30000, OVER_30000]
    SourceOfFunds:
      type: string
      enum: [SALARY, BUSINESS, PENSION, SAVINGS, FAMILY_SUPPORT, OTHER]
    IdDocument:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/IdDocumentType'
        number:
          type: string
          minLength: 4
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
    PostalAddress:
      type: object
      additionalProperties: false
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          description: ISO 3166-1 alpha-2
          type: string
          pattern: '^[A-Z]{2}$'
    Applicant:
      description: |
        Prospect identity and KYC questionnaire. Every field is optional
        while the application is a draft; the required ones are checked on
        submit (see `submitAccountApplication`).
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        placeOfBirth:
          type: string
        nationality:
          description: ISO 3166-1 alpha-2
          type: string
          pattern: '^[A-Z]{2}$'
        idDocument:
          $ref: '#/components/schemas/IdDocument'
        phone:
          description: E.164, e.g. +212612345678
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/PostalAddress'
        occupation:
          type: string
        employerName:
          type: string
        monthlyIncomeRange:
          $ref: '#/components/schemas/IncomeRange'
        sourceOfFunds:
          $ref: '#/components/schemas/SourceOfFunds'
        isPoliticallyExposed:
          description: Self-declaration of politically exposed person (PEP) status
          type: boolean
        usPerson:
          description: FATCA self-declaration (US citizen or tax resident)
          type: boolean
    Consents:
      description: Required by law 09-08 on personal data protection
      type: object
      additionalProperties: false
      properties:
        dataProcessing:
          description: Consent to the processing of personal data; must be true to submit
          type: boolean
        marketing:
          type: boolean
    AccountApplicationCreate:
      type: object
      required: [channel, productCode]
      additionalProperties: false
      properties:
        channel:
          $ref: '#/components/schemas/ApplicationChannel'
        kioskId:
          description: Required for the KIOSK channel
          allOf:
            - $ref: '#/components/schemas/Code'
        productCode:
          $ref: '#/components/schemas/AccountProduct'
        applicant:
          $ref: '#/components/schemas/Applicant'
        consents:
          $ref: '#/components/schemas/Consents'
    AccountApplicationUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        productCode:
          $ref: '#/components/schemas/AccountProduct'
        applicant:
          $ref: '#/components/schemas/Applicant'
        consents:
          $ref: '#/components/schemas/Consents'
    ApplicationDocumentType:
      type: string
      enum: [ID_FRONT, ID_BACK, SELFIE, PROOF_OF_ADDRESS, PROOF_OF_INCOME]
    DocumentMimeType:
      type: string
      enum: [image/jpeg, image/png, application/pdf]
    ApplicationDocumentUpload:
      type: object
      required: [type, fileName, mimeType, contentBase64]
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/ApplicationDocumentType'
        fileName:
          type: string
          minLength: 1
        mimeType:
          $ref: '#/components/schemas/DocumentMimeType'
        contentBase64:
          description: File content in base64, 5 MB at most once decoded
          type: string
          contentEncoding: base64
          minLength: 4
    ApplicationDocument:
      type: object
      required: [documentId, type, fileName, mimeType, sizeBytes, uploadedAt]
      properties:
        documentId:
          type: string
        type:
          $ref: '#/components/schemas/ApplicationDocumentType'
        fileName:
          type: string
        mimeType:
          $ref: '#/components/schemas/DocumentMimeType'
        sizeBytes:
          type: integer
          minimum: 1
        uploadedAt:
          type: string
          format: date-time
    KycCheckCode:
      type: string
      enum: [ID_DOCUMENT_VALIDITY, AGE, FACE_MATCH, SANCTIONS_SCREENING, PEP_SCREENING, DUPLICATE_CUSTOMER, FATCA]
    KycCheckResult:
      description: '`PASS`; `REVIEW` (a compliance officer must decide); `FAIL` (the application is rejected)'
      type: string
      enum: [PASS, REVIEW, FAIL]
    KycCheck:
      type: object
      required: [check, result, message]
      properties:
        check:
          $ref: '#/components/schemas/KycCheckCode'
        result:
          $ref: '#/components/schemas/KycCheckResult'
        reasonCode:
          type: string
          examples: [ID_EXPIRED, UNDERAGE, FACE_MISMATCH, SANCTIONS_HIT, PEP_DECLARED, PEP_LIST_HIT, EXISTING_CUSTOMER, US_PERSON]
        message:
          type: string
    KycResult:
      type: object
      required: [checks, riskLevel, outcome, evaluatedAt]
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/KycCheck'
        riskLevel:
          description: '`HIGH` for a PEP; `MEDIUM` for a non-resident nationality, a US person or funds of other origin; else `LOW`'
          allOf:
            - $ref: '#/components/schemas/RiskLevel'
        outcome:
          type: string
          enum: [AUTO_APPROVED, MANUAL_REVIEW, AUTO_REJECTED]
        evaluatedAt:
          type: string
          format: date-time
    ApplicationDecisionRequest:
      type: object
      required: [decision, comment]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reasonCode:
          description: Required to reject
          type: string
          examples: [PEP_NOT_ACCEPTED, INCONSISTENT_DOCUMENTS, HIGH_RISK]
        comment:
          type: string
          minLength: 1
    ApplicationDecision:
      type: object
      required: [decision, comment, decidedBy, decidedAt]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reasonCode:
          type: string
        comment:
          type: string
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
    OpenedAccount:
      type: object
      required: [accountId, rib, productCode, currency, openedAt]
      properties:
        accountId:
          type: string
        rib:
          description: Moroccan RIB, 24 digits
          type: string
          pattern: '^[0-9]{24}$'
        productCode:
          $ref: '#/components/schemas/AccountProduct'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        openedAt:
          type: string
          format: date-time
    AccountApplication:
      type: object
      required: [applicationId, status, channel, productCode, applicant, phoneVerified, documents, createdAt, updatedAt, expiresAt]
      properties:
        applicationId:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        channel:
          $ref: '#/components/schemas/ApplicationChannel'
        kioskId:
          $ref: '#/components/schemas/Code'
        productCode:
          $ref: '#/components/schemas/AccountProduct'
        applicant:
          $ref: '#/components/schemas/Applicant'
        consents:
          $ref: '#/components/schemas/Consents'
        phoneVerified:
          type: boolean
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationDocument'
        kyc:
          description: Set on submit
          allOf:
            - $ref: '#/components/schemas/KycResult'
        review:
          description: Compliance decision, when the application went through manual review
          allOf:
            - $ref: '#/components/schemas/ApplicationDecision'
        account:
          description: Set when the application is APPROVED
          allOf:
            - $ref: '#/components/schemas/OpenedAccount'
        cancellation:
          type: object
          required: [cancelledAt]
          properties:
            reason:
              type: string
            cancelledAt:
              type: string
              format: date-time
        createdBy:
          description: User id of the agent, for the BRANCH channel
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        expiresAt:
          description: A draft not submitted by this date is purged (30 days)
          type: string
          format: date-time
    AccountApplicationCreated:
      allOf:
        - $ref: '#/components/schemas/AccountApplication'
        - type: object
          required: [applicationToken]
          properties:
            applicationToken:
              description: Bearer token giving access to this application only (KIOSK channel). Returned once.
              type: string
    AccountApplicationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountApplication'
        nextCursor:
          description: Absent on the last page
          type: string
    PhoneVerificationStarted:
      type: object
      required: [maskedPhone, expiresAt, attemptsAllowed]
      properties:
        maskedPhone:
          type: string
          examples: ['+2126******78']
        expiresAt:
          type: string
          format: date-time
        attemptsAllowed:
          type: integer
          minimum: 1
    PhoneVerificationConfirm:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'

    # ─────────────── errors ───────────────
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. CBS_UNAVAILABLE
          examples: [CBS_UNAVAILABLE]
        message:
          type: string
          description: Technical message, not shown as-is to the end user
        correlationId:
          type: string
          format: uuid
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
              issue:
                type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but the role does not allow it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Duplicate code, or blocked by a dependency (in use, built-in, kiosk online)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Refused:
      description: Business refusal (limit, insufficient funds, service unavailable on the kiosk, ...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: A downstream system is unavailable (CBS for banking calls, KMS for /kms calls)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Timeout:
      description: A downstream system did not answer in time
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
