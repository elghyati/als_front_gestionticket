openapi: 3.1.0
info:
  title: ALS Front – MVP API contract
  version: 0.3.0
  description: |
    Contract between the MVP front-end (kiosk and portal) and the back-end
    services (Agent, KMS-Supervision, KMS-Routeur), which are not ready yet.
    The front-end builds against this contract and the MSW mock in `src/mocks`.

    **Status: DRAFT** – frozen on Mon 12 Oct. After the freeze, changes go
    through a documented change request with the affected owners.

    Conventions:
    - Every request carries an `X-Correlation-Id` header (UUID); every response
      and every error echoes it.
    - Every error uses the `Error` schema.
    - Amounts are decimal numbers in the account currency (ISO 4217 code).
    - Lists are returned as `{ items }`; long lists are paginated with an
      opaque `cursor` / `nextCursor`.
    - Create returns `201`, partial update is `PATCH`, delete returns `204`.
      A duplicate code or a delete blocked by a dependency returns `409`.

    KMS (Kiosk Management System) access by role:

    | Operations | Roles |
    |---|---|
    | Read kiosks, devices, history, catalogue, services | AGENT, SUPERVISOR, ADMIN |
    | Change a device status | SUPERVISOR, ADMIN |
    | Create / update / delete, assignments, requirements, settings | ADMIN |
    | Read the services of a kiosk, read deposit and withdrawal settings | any authenticated user (the kiosk app needs them) |

    Account opening access: the prospect with the application token (KIOSK
    channel); AGENT and ADMIN to create and complete an application at the
    branch; AGENT, SUPERVISOR, ADMIN and COMPLIANCE to read; **COMPLIANCE
    only** to decide on an application under review.

    Service availability on a kiosk (computed, see `KioskService`):
    a device is *usable* when its status is `OPERATIONAL` or `WARNING`.
    For each device type the service requires, if the kiosk has no usable
    device of that type:
    - `MANDATORY` → the service is `UNAVAILABLE`
    - `RECOMMENDED` → the service is `DEGRADED` (works, with reduced features)
    - `OPTIONAL` → the service stays `AVAILABLE`; the issue is still reported
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1
    description: Same origin (MSW mock in dev, reverse proxy later)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication (kiosk card/PIN and portal user login)
  - name: accounts
    description: Balance and history
  - name: transactions
    description: Deposit and withdrawal operations
  - name: account-opening
    description: Account opening with KYC – application, documents, phone verification, automatic checks, compliance decision
  - name: kms-kiosks
    description: Kiosks (CRUD) and the services assigned to them
  - name: kms-devices
    description: Devices of a kiosk, their status and status history
  - name: kms-settings
    description: Configuration – device catalogue, services, service/device requirements, deposit and withdrawal settings

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in and get an access token
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ─────────────────────────── accounts ───────────────────────────
  /accounts/{accountId}/balance:
    get:
      tags: [accounts]
      operationId: getBalance
      summary: Get the balance of an account
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Current balance
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /accounts/{accountId}/transactions:
    get:
      tags: [accounts]
      operationId: listTransactions
      summary: Get the transaction history of an account (newest first)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of history
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ───────────────────────── transactions ─────────────────────────
  /deposits:
    post:
      tags: [transactions]
      operationId: createDeposit
      summary: Make a deposit on a kiosk
      description: |
        Refused with `422` when the DEPOSIT service is not available on the
        kiosk, or when a rule of `DepositSettings` is not met.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Deposit accepted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /withdrawals:
    post:
      tags: [transactions]
      operationId: createWithdrawal
      summary: Make a cash withdrawal on a kiosk
      description: |
        Refused with `422` when the WITHDRAWAL service is not available on the
        kiosk, when a rule of `WithdrawalSettings` is not met, or when the
        available balance is insufficient. The accepted envelope carries the
        notes to dispense in `cashBreakdown`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '201':
          description: Withdrawal accepted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ──────────────── account opening (KYC) ────────────────
  /account-applications:
    get:
      tags: [account-opening]
      operationId: listAccountApplications
      summary: List account opening applications (back-office work queue)
      description: |
        Back-office list, newest first. The compliance work queue is
        `?status=UNDER_REVIEW`. Roles: AGENT, SUPERVISOR, ADMIN, COMPLIANCE.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: channel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApplicationChannel'
        - name: riskLevel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RiskLevel'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of applications
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplicationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [account-opening]
      operationId: createAccountApplication
      summary: Start an account opening application (draft)
      description: |
        - Channel `KIOSK`: self-service, **no token needed** (the prospect has
          no account yet). `kioskId` is required and the ACCOUNT_OPENING
          service must not be UNAVAILABLE on that kiosk (else `422`). The
          response carries an `applicationToken`, to send as
          `Authorization: Bearer <applicationToken>` on the next calls for
          this application only.
        - Channel `BRANCH`: an AGENT or ADMIN token is required.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountApplicationCreate'
      responses:
        '201':
          description: Draft created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplicationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}:
    get:
      tags: [account-opening]
      operationId: getAccountApplication
      summary: Get an application, with its KYC result and the opened account
      description: Allowed with the application token, or for AGENT, SUPERVISOR, ADMIN, COMPLIANCE.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [account-opening]
      operationId: updateAccountApplication
      summary: Complete or correct a draft application (partial)
      description: |
        Only while `DRAFT` (else `409 APPLICATION_NOT_EDITABLE`). Fields of
        `applicant` are merged one level deep: `idDocument` and `address`
        are replaced as a whole. Changing `applicant.phone` resets
        `phoneVerified`. Allowed with the application token, or for AGENT, ADMIN.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountApplicationUpdate'
      responses:
        '200':
          description: Application updated
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}/documents:
    get:
      tags: [account-opening]
      operationId: listApplicationDocuments
      summary: List the KYC documents of an application (metadata only)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Documents
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [account-opening]
      operationId: uploadApplicationDocument
      summary: Upload a KYC document (ID scan, selfie, proof of address…)
      description: |
        Only while `DRAFT`. JPEG, PNG or PDF, 5 MB at most, sent in base64.
        Uploading a type already present replaces it.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDocumentUpload'
      responses:
        '201':
          description: Document stored
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}/documents/{documentId}:
    delete:
      tags: [account-opening]
      operationId: deleteApplicationDocument
      summary: Delete a KYC document (only while DRAFT)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Document deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}/phone-verification:
    post:
      tags: [account-opening]
      operationId: startPhoneVerification
      summary: Send a one-time code (OTP) by SMS to the applicant's phone
      description: |
        Only while `DRAFT`, and once `applicant.phone` is set (else
        `422 PHONE_MISSING`). The code is valid 10 minutes, 3 attempts.
        A new call sends a new code. The mock always sends `123456`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: Code sent
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerificationStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}/phone-verification/confirm:
    post:
      tags: [account-opening]
      operationId: confirmPhoneVerification
      summary: Confirm the phone with the code received by SMS
      description: |
        `422` with `OTP_NOT_REQUESTED`, `OTP_EXPIRED`, `OTP_INVALID` or
        `OTP_ATTEMPTS_EXCEEDED` (a new code must then be requested).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationConfirm'
      responses:
        '200':
          description: Phone verified
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}/submit:
    post:
      tags: [account-opening]
      operationId: submitAccountApplication
      summary: Submit the application and run the KYC checks
      description: |
        Only while `DRAFT`. `422 APPLICATION_INCOMPLETE` with `details` when
        a required field or document is missing, the phone is not verified
        or the data processing consent is not given. Otherwise the KYC
        checks run and decide the new status:
        - a check `FAIL` → `REJECTED`;
        - a check `REVIEW` or a `HIGH` risk → `UNDER_REVIEW` (compliance decides);
        - else → `APPROVED`, and the account is opened (`account`).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application with its KYC result and new status
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Refused'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}/decision:
    post:
      tags: [account-opening]
      operationId: decideAccountApplication
      summary: Compliance decision on an application under review
      description: |
        Role COMPLIANCE. Only while `UNDER_REVIEW` (else `409`). `APPROVE`
        opens the account; `REJECT` needs a `reasonCode`. The comment is
        mandatory (audit trail).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
      responses:
        '200':
          description: Application decided
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /account-applications/{applicationId}/cancel:
    post:
      tags: [account-opening]
      operationId: cancelAccountApplication
      summary: Cancel an application (DRAFT or UNDER_REVIEW)
      description: Allowed with the application token, or for AGENT, ADMIN.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Application cancelled
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  # ────────────────────────── KMS: kiosks ─────────────────────────
  /kms/kiosks:
    get:
      tags: [kms-kiosks]
      operationId: listKiosks
      summary: List the kiosks
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/KioskStatus'
        - name: health
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/KioskHealth'
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive search in id and name
          schema:
            type: string
      responses:
        '200':
          description: Kiosks
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Kiosk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [kms-kiosks]
      operationId: createKiosk
      summary: Create a kiosk
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
